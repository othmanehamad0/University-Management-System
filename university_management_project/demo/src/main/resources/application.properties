spring.application.name=demo

# ==========================
# Server
# ==========================
server.port=8080

# ==========================
# MySQL Database
# ==========================
spring.datasource.url=jdbc:mysql://localhost:3306/univ_pr_db
spring.datasource.username=root
spring.datasource.password=@@nanjing2004@@
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================
# JPA / Hibernate
# ==========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================
# Generate SQL Script
# ==========================
spring.jpa.properties.jakarta.persistence.schema-generation.database.action=none
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.action=create
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.create-target=C:/Users/one/Desktop/create.sql
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.create-source=metadata